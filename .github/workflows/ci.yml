name: CI

on:
  push:
    # ครอบ branch ที่พัฒนากันจริง ไม่ใช่แค่ main/master
    # (งานย้ายมา SQL Server ทำบน mssql-migration ซึ่งเดิมไม่มี CI ตรวจเลย)
    branches: [main, master, mssql-migration]
  pull_request:
    branches: [main, master, mssql-migration]

jobs:
  # ── ตรวจที่ไม่ต้องใช้ฐานข้อมูล — เร็ว ให้ผลก่อน ──────────────────────────
  validate:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # 58 เคส ไม่ต้องต่อฐานข้อมูล (เทสที่ต้องใช้ DB จะข้ามเอง)
      - run: npm test

      - run: npm run lint

      # ค่าเหล่านี้แค่ทำให้ build ผ่าน ไม่ได้ต่อฐานข้อมูลจริงตอน build
      - run: npm run build
        env:
          MSSQL_SERVER: localhost
          MSSQL_DATABASE: ci
          MSSQL_USER: ci
          MSSQL_PASSWORD: ci-not-used-at-build-time
          NEXTAUTH_SECRET: ci-secret-min-32-chars-long-enough
          NEXTAUTH_URL: http://localhost:3000

  # ── ตรวจที่ต้องใช้ SQL Server จริง ──────────────────────────────────────
  # คุ้ม deadlock ตอนออกเลขเอกสาร ซึ่งเป็นบั๊กที่หลุดมาก่อนเพราะไม่มีอะไรจับ
  database:
    name: Database tests (SQL Server)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'CiStrong!Passw0rd'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      MSSQL_SERVER: localhost
      MSSQL_PORT: '1433'
      MSSQL_DATABASE: requestonline
      MSSQL_USER: sa
      MSSQL_PASSWORD: 'CiStrong!Passw0rd'
      MSSQL_ENCRYPT: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Create database
        run: |
          docker exec "$(docker ps --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest --format '{{.ID}}')" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiStrong!Passw0rd' -C \
            -Q "IF DB_ID('requestonline') IS NULL CREATE DATABASE [requestonline]"

      - name: Apply schema
        run: npx prisma db push --skip-generate

      # READ_COMMITTED_SNAPSHOT เป็นค่าที่ production ต้องเปิด — เปิดใน CI ด้วย
      # เพื่อให้เทสเจอสภาพเดียวกับของจริง
      - name: Enable READ_COMMITTED_SNAPSHOT
        run: npx tsx scripts/enable-rcsi.ts

      - name: Concurrency / deadlock regression
        run: npm run test:db
